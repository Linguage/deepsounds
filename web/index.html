<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>deepsounds</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-7 9 7M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="17.6" rx="3" ry="2.2"/><ellipse cx="17" cy="15.6" rx="3" ry="2.2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h8M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5 4.6 13a4.9 4.9 0 0 1 6.9-7l.5.5.5-.5a4.9 4.9 0 0 1 6.9 7Z"/></symbol>
    <symbol id="i-add-queue" viewBox="0 0 24 24"><path d="M4 6h15M4 11h10M4 16h7m7-5v8m-4-4h8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5.5 19v-1a4.5 4.5 0 0 1 4.5-4.5h4a4.5 4.5 0 0 1 4.5 4.5v1"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="M7 4.5a1 1 0 0 1 1.52-.85l12 7.5a1 1 0 0 1 0 1.7l-12 7.5A1 1 0 0 1 7 19.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="fill" d="M7 4.5h3.5v15H7zm6.5 0H17v15h-3.5z"/></symbol>
    <symbol id="i-previous" viewBox="0 0 24 24"><path class="fill" d="M4 5h2v14H4zm15.5 0a.9.9 0 0 1 1.5.7v12.6a.9.9 0 0 1-1.5.7l-11-6.3a.8.8 0 0 1 0-1.4z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="fill" d="M20 5h-2v14h2zM4.5 5a.9.9 0 0 0-1.5.7v12.6a.9.9 0 0 0 1.5.7l11-6.3a.8.8 0 0 0 0-1.4z"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M5.5 4.5h13a2.5 2.5 0 0 1 2.5 2.5v8a2.5 2.5 0 0 1-2.5 2.5h-6.7l-4.8 3.3v-3.3H5.5A2.5 2.5 0 0 1 3 15V7a2.5 2.5 0 0 1 2.5-2.5Z"/><path d="M8 9.5h8M8 13h5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5l4.5 4zM15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5l4.5 4zM16 10l4 4m0-4-4 4"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-8 8m6 0v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="i-exit-fullscreen" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></symbol>
    <symbol id="i-video-default" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
    <symbol id="i-video-theater" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14M9 4v4m6 2v4m-5 2v4"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6m2-11v5h-5"/></symbol>
  </svg>

  <aside id="content-rail" class="rail" aria-label="内容导航">
    <div class="brand"><img src="./icon.svg" width="29" height="29" alt=""><h1>deepsounds</h1></div>
    <div class="source-switch" role="group" aria-label="内容来源">
      <button type="button" data-source="netease" aria-label="网易云音乐" aria-pressed="true">网易云</button>
      <button type="button" data-source="xiaoyuzhou" aria-pressed="false">小宇宙</button>
      <button type="button" data-source="bilibili" aria-label="哔哩哔哩" aria-pressed="false">B 站<span id="bilibili-update-dot" hidden aria-hidden="true"></span></button>
    </div>
    <nav class="navigation" aria-label="内容分类">
      <div class="nav-group" id="browse-nav">
        <p class="nav-label">浏览</p>
        <button class="nav-item" type="button" id="home" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>主页</button>
      </div>
      <div class="nav-group" id="search-nav">
        <p class="nav-label">搜索</p>
        <button class="nav-item" type="button" data-kind="song" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-note"/></svg><span id="song-nav-label">歌曲</span></button>
        <button class="nav-item" type="button" data-kind="playlist" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span id="collection-nav-label">歌单</span></button>
      </div>
      <div class="nav-group">
        <p class="nav-label">资料库</p>
        <button class="nav-item" type="button" id="bilibili-updates" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-retry"/></svg>关注更新<span class="update-count" id="bilibili-update-count" hidden></span></button>
        <button class="nav-item" type="button" id="bilibili-following" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>关注的 UP 主</button>
        <button class="nav-item" type="button" id="my-playlists" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-library"/></svg><span id="library-nav-label">我的歌单</span></button>
        <button class="nav-item" type="button" id="podcast-playback-list" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>播放列表</button>
        <button class="nav-item" type="button" id="bilibili-watch-later" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>稍后再看</button>
        <button class="nav-item" type="button" id="podcast-favorites" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg>收藏节目</button>
        <button class="nav-item" type="button" id="track-favorites" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg><span id="track-favorites-label">收藏歌曲</span></button>
      </div>
    </nav>
    <div id="netease-account" class="account-controls">
      <span class="avatar" aria-hidden="true"><svg class="icon"><use href="#i-user"/></svg></span>
      <div class="account-text">
        <span id="account-name" hidden></span>
        <button id="account-action" type="button">扫码登录</button>
      </div>
    </div>
    <div id="podcast-account" class="account-controls" hidden>
      <span class="avatar" aria-hidden="true"><svg class="icon"><use href="#i-user"/></svg></span>
      <div class="account-text"><span id="podcast-account-name" hidden></span><button id="podcast-account-action" type="button">扫码登录</button></div>
    </div>
    <div id="bilibili-account" class="account-controls" hidden>
      <span class="avatar" aria-hidden="true"><svg class="icon"><use href="#i-user"/></svg></span>
      <div class="account-text"><span id="bilibili-account-name" hidden></span><button id="bilibili-account-action" type="button">扫码登录</button></div>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <button id="navigation-open" class="icon-button" type="button" title="打开内容导航" aria-label="打开内容导航" aria-haspopup="dialog" aria-controls="navigation-drawer" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <span id="view-label" class="view-label">主页</span>
      <form id="search-form" role="search">
        <label class="sr-only" for="query">搜索关键词或粘贴分享链接</label>
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="query" type="search" autocomplete="off" required placeholder="搜索歌曲或歌手">
        <button class="search-submit" type="submit" aria-label="搜索"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
      </form>
      <button id="update-open" class="icon-button" type="button" title="检查插件更新" aria-label="检查插件更新"><svg class="icon" aria-hidden="true"><use href="#i-retry"/></svg></button>
      <button id="platform-settings-open" class="icon-button" type="button" title="平台设置" aria-label="平台设置" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </header>

    <div class="workspace">
      <section id="collection" class="collection" aria-labelledby="results-title" data-empty="true">
        <div class="collection-content">
          <button id="back" class="back" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span id="back-label">返回结果</span></button>
          <div class="collection-heading">
            <span id="collection-cover" class="cover collection-cover" aria-hidden="true" hidden></span>
            <div class="collection-info">
              <span id="collection-kicker" class="collection-kicker" hidden></span>
              <svg id="empty-icon" class="icon empty-icon" aria-hidden="true"><use href="#i-note"/></svg>
              <h2 id="results-title">搜索音乐</h2>
              <p id="result-meta"></p>
              <p id="collection-description" class="collection-description" hidden></p>
              <button id="collection-play" class="primary" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>播放</button>
              <button id="collection-sync" class="more" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-retry"/></svg><span id="collection-sync-label">重新同步</span></button>
              <button id="bilibili-update-toggle" class="more" type="button" aria-pressed="false" hidden>开启提醒</button>
              <button id="bilibili-update-read" class="more" type="button" hidden>标为已读</button>
              <p id="bilibili-update-hint" hidden></p>
              <button id="collection-save" class="more" type="button" aria-pressed="false" hidden>收藏节目</button>
              <button id="creator-follow" class="more" type="button" aria-pressed="false" hidden>关注 UP 主</button>
              <a id="collection-official" class="detail-link" target="_blank" rel="noopener noreferrer" hidden>在小宇宙打开 ↗</a>
              <button id="empty-login" class="primary" type="button" hidden>扫码登录</button>
            </div>
          </div>
          <p id="result-status" class="result-status" role="status"></p>
          <p id="creator-action-status" class="result-status" role="status" hidden></p>
          <div class="section-bar"><h3 id="section-heading" class="section-heading" hidden>推荐歌单</h3><a id="podcast-index-credit" href="https://xyzrank.top/" target="_blank" rel="noopener noreferrer" hidden>XYZ Rank ↗</a></div>
          <div id="list-heading" class="list-heading" aria-hidden="true" hidden><span id="item-heading">名称</span><span id="album-heading" class="album-column">专辑</span><span>时长</span></div>
          <ul id="results" aria-label="搜索结果"></ul>
          <button id="more" class="more" type="button" hidden>加载更多</button>
        </div>
      </section>
      <section id="video-panel" class="video-panel" aria-labelledby="video-title" hidden>
        <div class="video-content">
          <div class="video-toolbar">
            <button id="video-close" class="back" type="button"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>返回列表</button>
            <a id="video-official" class="detail-link" target="_blank" rel="noopener noreferrer">在哔哩哔哩打开 ↗</a>
          </div>
          <h2 id="video-title"></h2>
          <div class="video-info">
            <p id="video-owner"></p>
            <div class="video-actions" aria-label="B 站视频操作">
              <button id="video-like" class="more" type="button" aria-pressed="false">点赞</button>
              <button id="video-save" class="more" type="button" aria-haspopup="dialog">收藏</button>
              <button id="video-follow" class="more" type="button" aria-pressed="false">关注 UP 主</button>
              <button id="video-actions-retry" class="more" type="button" hidden>重试</button>
            </div>
          </div>
          <p id="video-action-status" class="result-status" role="status"></p>
          <div id="video-frame" class="video-frame">
            <div id="video-stage" class="video-stage"></div>
          </div>
          <p id="video-status" role="status"></p>
        </div>
      </section>
      <dialog id="video-save-dialog" class="login-dialog video-save-dialog" aria-labelledby="video-save-title">
        <h2 id="video-save-title">收藏到 B 站</h2>
        <div id="video-save-folders" class="video-save-folders" role="group" aria-label="收藏夹"></div>
        <p id="video-save-status" class="result-status" role="status"></p>
        <div class="dialog-actions">
          <button id="video-save-apply" class="primary" type="button" disabled>保存</button>
          <button id="video-save-close" class="more" type="button" autofocus>关闭</button>
        </div>
      </dialog>
      <aside id="lyrics-panel" class="now" aria-labelledby="now-title" hidden>
        <div id="lyric-ambient" class="lyric-ambient" aria-hidden="true"></div>
        <button id="lyrics-close" class="back lyrics-close" type="button"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>返回</button>
        <div class="now-inner">
          <div class="now-record">
            <span id="lyric-cover" class="cover lyric-cover" aria-hidden="true"></span>
            <h2 id="now-title"><span id="lyric-track">暂无播放</span></h2>
            <p id="lyric-artist"></p>
          </div>
          <div id="lyric-scroll" class="lyric-scroll" tabindex="0" aria-label="歌词">
            <p id="lyric-status">播放歌曲后，这里会显示歌词。</p>
            <div id="lyric-lines"></div>
            <div id="episode-notes" class="episode-notes" hidden><h3>单集简介</h3><p id="notes-copy"></p></div>
          </div>
        </div>
      </aside>
    </div>
    <button id="bilibili-update-toast" type="button" aria-live="polite" hidden></button>

    <audio id="audio" preload="none" hidden></audio>
    <footer id="player" class="player" aria-label="播放器">
      <div class="transport" role="group" aria-label="播放控制">
        <button type="button" class="icon-button" id="previous" aria-label="上一首" title="上一首" disabled><svg class="icon" aria-hidden="true"><use href="#i-previous"/></svg></button>
        <button type="button" class="icon-button play-toggle" id="play-toggle" aria-label="播放" title="播放" disabled><svg class="icon" aria-hidden="true"><use id="play-icon" href="#i-play"/></svg></button>
        <button type="button" class="icon-button" id="next" aria-label="下一首" title="下一首" disabled><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
      <div class="track">
        <span id="player-cover" class="cover player-cover" aria-hidden="true"></span>
        <div class="track-body">
          <div class="track-info">
            <p id="player-title">暂无播放</p>
            <p id="player-artist"></p>
            <p id="player-status" role="status"></p>
          </div>
          <div class="progress">
            <span id="elapsed">0:00</span>
            <input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度" disabled>
            <span id="duration">0:00</span>
          </div>
        </div>
      </div>
      <div class="player-actions">
        <button type="button" class="icon-button" id="retry" aria-label="重试播放" title="重试播放" hidden><svg class="icon" aria-hidden="true"><use href="#i-retry"/></svg></button>
        <a class="icon-button official" id="official" target="_blank" rel="noopener noreferrer" aria-label="打开来源页面" title="打开来源页面" hidden><svg class="icon" aria-hidden="true"><use href="#i-out"/></svg></a>
        <button type="button" class="icon-button" id="lyrics-toggle" aria-label="歌词" title="歌词" aria-controls="lyrics-panel" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-lyrics"/></svg></button>
        <button type="button" class="icon-button" id="queue-toggle" aria-label="本机队列" title="本机队列" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg></button>
        <div class="volume">
          <button type="button" class="icon-button" id="mute" aria-label="静音" title="静音"><svg class="icon" aria-hidden="true"><use id="volume-icon" href="#i-volume"/></svg></button>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="音量">
        </div>
        <details id="video-settings" class="video-settings" hidden>
          <summary class="icon-button" aria-label="播放器设置" title="播放器设置"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></summary>
          <div class="video-settings-menu">
            <label class="video-quality">画质 <select id="video-quality" disabled><option value="auto">自动</option></select></label>
            <label id="video-history-label" hidden><input id="video-history" type="checkbox"> 同步观看记录到 B 站</label>
            <p id="video-history-status" role="status"></p>
          </div>
        </details>
        <div id="video-modes" class="video-modes" role="group" aria-label="观看模式" hidden>
          <button type="button" class="icon-button" id="video-default" aria-label="默认尺寸" title="默认尺寸" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-video-default"/></svg></button>
          <button type="button" class="icon-button" id="video-theater" aria-label="影院模式" title="影院模式" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-video-theater"/></svg></button>
          <button type="button" class="icon-button" id="video-fullscreen" aria-label="全屏" title="全屏" aria-pressed="false"><svg class="icon" aria-hidden="true"><use id="fullscreen-icon" href="#i-fullscreen"/></svg></button>
        </div>
      </div>
    </footer>
  </main>

  <dialog id="navigation-drawer" class="navigation-drawer" aria-label="内容导航">
    <button id="navigation-close" class="icon-button" type="button" aria-label="关闭内容导航" autofocus><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </dialog>

  <dialog id="platform-settings" class="login-dialog" aria-labelledby="platform-settings-title">
    <h2 id="platform-settings-title">平台设置</h2>
    <p class="update-versions">选择要在 deepsounds 中使用的平台。</p>
    <div class="platform-options">
      <label><span>网易云音乐</span><input type="checkbox" value="netease"></label>
      <label><span>小宇宙</span><input type="checkbox" value="xiaoyuzhou"></label>
      <label><span>哔哩哔哩</span><input type="checkbox" value="bilibili"></label>
    </div>
    <p id="platform-settings-status" role="status"></p>
    <div class="dialog-actions">
      <button id="platform-settings-save" class="primary" type="button">保存</button>
      <button id="platform-settings-cancel" class="more" type="button">取消</button>
    </div>
  </dialog>

  <dialog id="update-dialog" class="login-dialog" aria-labelledby="update-title">
    <h2 id="update-title">插件更新</h2>
    <p id="update-versions" class="update-versions" hidden></p>
    <p id="update-status" class="login-status" role="status"></p>
    <div class="dialog-actions">
      <button id="update-install" class="primary" type="button" hidden>安装更新</button>
      <a id="update-download" class="more update-download" target="_blank" rel="noopener noreferrer" hidden>下载安装包</a>
      <button id="update-check" class="more" type="button" hidden>重新检查</button>
      <button id="update-close" class="more" type="button" autofocus>关闭</button>
    </div>
    <a id="update-release" class="detail-link" href="https://github.com/Linguage/deepsounds/releases/latest" target="_blank" rel="noopener noreferrer">查看 GitHub 发行版 ↗</a>
  </dialog>

  <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
    <h2 id="login-title">扫码登录网易云音乐</h2>
    <img id="login-qr" class="login-qr" width="210" height="210" alt="网易云音乐登录二维码" hidden>
    <p id="login-status" class="login-status" role="status"></p>
    <div class="dialog-actions">
      <button id="login-retry" class="primary" type="button" hidden>刷新二维码</button>
      <button id="login-close" class="more" type="button">取消</button>
    </div>
  </dialog>
</body>
</html>
